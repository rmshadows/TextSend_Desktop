# 手动打安装包 / 绿色包（走仓库里的 pack/ 脚本，不自动跑）
# Actions → Pack → Run workflow
name: Pack

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which OS to pack (cannot cross-compile)
        type: choice
        options:
          - all
          - linux
          - linux-amd64
          - linux-arm64
          - windows
          - macos
        default: all

permissions:
  contents: read

concurrency:
  group: pack-${{ github.ref }}-${{ github.event.inputs.platform }}
  cancel-in-progress: true

jobs:
  # Ubuntu 24.04 x64。jpackage 原版 .deb Depends 按本机扫库（常含 libasound2t64，接近 Debian 13）；另打 *.compat.deb
  pack-linux-amd64:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' || inputs.platform == 'linux-amd64' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install deb tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev
          echo "LANG=${LANG:-}"
          . /etc/os-release
          echo "OS=$PRETTY_NAME"
          uname -m

      - name: Pack (./pack/pack.sh)
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          chmod +x pack/*.sh
          ./pack/pack.sh

      - name: Upload Linux amd64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TextSend-linux-amd64
          path: |
            dist/*.jar
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error
          retention-days: 14

  # Ubuntu 24.04 arm64（公开仓库免费 runner）。私有仓此标签不可用。
  pack-linux-arm64:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' || inputs.platform == 'linux-arm64' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install deb tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev
          echo "LANG=${LANG:-}"
          . /etc/os-release
          echo "OS=$PRETTY_NAME"
          uname -m

      - name: Pack (./pack/pack.sh)
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          chmod +x pack/*.sh
          ./pack/pack.sh

      - name: Upload Linux arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TextSend-linux-arm64
          path: |
            dist/*.jar
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error
          retention-days: 14

  pack-windows:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # pack-win.bat 会找 %USERPROFILE%\Program\wix311-binaries
      - name: Install WiX 3 binaries
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "wix314-binaries.zip"
          $dest = Join-Path $env:USERPROFILE "Program\wix311-binaries"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $zip
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          if (-not (Test-Path (Join-Path $dest "candle.exe"))) {
            throw "candle.exe missing under $dest"
          }
          Write-Host "WiX 3 at $dest"

      - name: Pack (pack\pack.bat → WiX 3)
        shell: cmd
        run: pack\pack.bat

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TextSend-windows
          path: |
            dist/*.jar
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 14

  pack-macos:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Pack (./pack/pack.sh)
        run: |
          chmod +x pack/*.sh
          ./pack/pack.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TextSend-macos
          path: |
            dist/*.jar
            dist/*.tar.gz
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14
